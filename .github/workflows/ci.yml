name: CI & Hostinger Deploy (angelesdeesperanzaac.org)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Lint & Build PWA (Vite + React 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: TypeScript typecheck (lint)
        run: npm run lint

      - name: Build production PWA bundle
        run: |
          npm run build

          cat > dist/.htaccess <<'EOF'
          <IfModule mod_mime.c>
            AddType application/manifest+json .webmanifest
          </IfModule>

          <IfModule mod_headers.c>
            <FilesMatch "^(sw\.js|registerSW\.js|manifest\.webmanifest)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
          </IfModule>

          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            RewriteRule ^ index.html [L]
          </IfModule>
          EOF

      - name: Upload production PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: angeles-pwa-production-build
          retention-days: 7
          include-hidden-files: true
          path: dist/

  deploy-hostinger:
    name: Deploy to Hostinger (angelesdeesperanzaac.org)
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download production PWA artifact
        uses: actions/download-artifact@v4
        with:
          name: angeles-pwa-production-build
          path: ./deploy-bundle

      - name: Deploy via SSH to Hostinger (191.96.56.71:65002)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '191.96.56.71' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME || 'u529127178' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY }}
          EXPECTED_FP: "SHA256:BSTXlZnj3EfIH48wI20RyZG1C9kj3d6bjjBN54AdBME"
          CUSTOM_APP_DIR: ${{ secrets.HOSTINGER_APP_DIR || vars.HOSTINGER_APP_DIR }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::notice::SSH_PRIVATE_KEY secret is not configured yet in GitHub Actions. Skipping Hostinger SSH deploy."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ACTUAL_FP=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          echo "Hostinger server ED25519 fingerprint: $ACTUAL_FP"
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "::error::Hostinger SSH host key fingerprint mismatch! Expected $EXPECTED_FP, got $ACTUAL_FP"
            exit 1
          fi

          TARGET_DIR="$CUSTOM_APP_DIR"
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="/home/u529127178/domains/angelesdeesperanzaac.org/public_html"
          fi

          echo "Deploying to $SSH_USERNAME@$SSH_HOST:$TARGET_DIR ..."
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "mkdir -p \"$TARGET_DIR\""
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" ./deploy-bundle/ "$SSH_USERNAME@$SSH_HOST:$TARGET_DIR/"
          echo "Deployment to angelesdeesperanzaac.org on Hostinger completed successfully!"
